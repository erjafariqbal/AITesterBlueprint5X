name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-framework:
    name: PlaywrightFramework (Wingify login)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Chapter_02_Prompt_Engineering/PlaywrightFramework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Chapter_02_Prompt_Engineering/PlaywrightFramework/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create qa.env
        run: |
          mkdir -p testdata
          {
            echo "BASE_URL=${{ secrets.VWO_BASE_URL || 'https://app.vwo.com/#/login' }}"
            echo "USER_USERNAME=${{ secrets.VWO_USER_USERNAME }}"
            echo "USER_PASSWORD=${{ secrets.VWO_USER_PASSWORD }}"
            echo "INCORRECT_USERNAME=unregistered.user@example.com"
            echo "INCORRECT_PASSWORD=WrongPass@123"
          } > testdata/qa.env
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-playwright-framework
          path: Chapter_02_Prompt_Engineering/PlaywrightFramework/allure-results/
          retention-days: 30
